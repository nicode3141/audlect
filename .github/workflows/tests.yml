name: run-tests

on:
    pull_request:
    push:
        branches: [main, dev]

jobs:
    quality:
        runs-on: ubuntu-latest
        continue-on-error: true
        env:
            SKIP_ENV_VALIDATION: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci

            - name: Check formatting
              continue-on-error: true
              run: npm run format:check

            - name: Lint
              continue-on-error: true
              run: npm run lint

            - name: Type check
              continue-on-error: true
              run: npm run typecheck

    test:
        runs-on: ubuntu-latest
        env:
            NODE_ENV: test
            SKIP_ENV_VALIDATION: true
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci

            - name: Run unit tests
              run: |
                  mkdir -p test-results
                  npx jest --ci --reporters=default --json --outputFile=test-results/jest-test.json

            - name: Upload test results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: jest-results
                  path: test-results/
                  retention-days: 30
